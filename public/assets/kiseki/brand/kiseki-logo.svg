<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Kiseki logo</title>
  <desc id="desc">A luminous folded star held inside a crescent orbit</desc>
  <defs>
    <linearGradient id="logo-gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset="1" stop-color="#D59B45"/>
    </linearGradient>
    <linearGradient id="logo-star" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF9DF"/>
      <stop offset=".55" stop-color="#F7DDA5"/>
      <stop offset="1" stop-color="#AFCBFF"/>
    </linearGradient>
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M137 22a104 104 0 1 0 0 202a83 83 0 1 1 0-202Z" fill="url(#logo-gold)" opacity=".95"/>
  <g filter="url(#logo-glow)">
    <path d="m128 40 18 54 57 2-45 33 15 56-45-33-47 33 17-56-46-33 58-2 18-54Z" fill="url(#logo-star)" stroke="#FFF7DB" stroke-linejoin="round" stroke-width="3"/>
    <path d="m128 40 0 112m0 0-47 33m47-33 45 33m-83-88 38 55m45-55-45 55" fill="none" stroke="#7E91C6" stroke-linecap="round" stroke-opacity=".7" stroke-width="3"/>
  </g>
  <circle cx="196" cy="55" r="6" fill="#F7DDA5"/>
</svg>
